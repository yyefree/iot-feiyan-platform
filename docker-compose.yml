services:
  postgres:
    image: docker.1ms.run/library/postgres:16-alpine
    container_name: iot-postgres
    environment:
      POSTGRES_USER: iot_admin
      POSTGRES_PASSWORD: iot_admin_2024
      POSTGRES_DB: iot_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot_admin -d iot_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.1ms.run/library/redis:7-alpine
    container_name: iot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  emqx:
    image: docker.1ms.run/emqx/emqx:5.7.1
    container_name: iot-emqx
    ports:
      - "1883:1883"
      - "8083:8083"
      - "8084:8084"
      - "18083:18083"
    environment:
      EMQX_NAME: emqx-1
      EMQX_HOST: emqx-1
    healthcheck:
      test: ["CMD", "epmd", "-names"]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: docker.1ms.run/library/influxdb:2-alpine
    container_name: iot-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin123
      DOCKER_INFLUXDB_INIT_ORG: iot-org
      DOCKER_INFLUXDB_INIT_BUCKET: iot-bucket
    volumes:
      - influxdb_data:/var/lib/influxdb2

  api-gateway:
    image: test-api-gateway:latest
    container_name: iot-api-gateway
    ports:
      - "8080:8080"
    environment:
      DEVICE_ADDR: http://device-service:8081
      PRODUCT_ADDR: http://product-service:8082
      RULE_ADDR: http://rule-service:8093
      DATA_ADDR: http://data-service:8084
      OPS_ADDR: http://ops-service:8085
      OTA_ADDR: http://ota-service:8088
      VOICE_ADDR: http://voice-service:8089
    depends_on:
      - device-service
      - product-service
      - rule-service
      - data-service
      - ops-service
      - ota-service
      - voice-service

  device-service:
    image: test-device-service:latest
    container_name: iot-device-service
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://iot_admin:iot_admin_2024@postgres:5432/iot_platform?sslmode=disable
      HOST: 0.0.0.0
      PORT: 8081
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-service:
    image: test-product-service:latest
    container_name: iot-product-service
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: postgres://iot_admin:iot_admin_2024@postgres:5432/iot_platform?sslmode=disable
      HOST: 0.0.0.0
      PORT: 8082
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  rule-service:
    image: test-rule-service:latest
    container_name: iot-rule-service
    ports:
      - "8093:8093"
    environment:
      DATABASE_URL: postgres://iot_admin:iot_admin_2024@postgres:5432/iot_platform?sslmode=disable
      HOST: 0.0.0.0
      PORT: 8093
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8093/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  data-service:
    image: test-data-service:latest
    container_name: iot-data-service
    ports:
      - "8084:8084"
    environment:
      DATABASE_URL: postgres://iot_admin:iot_admin_2024@postgres:5432/iot_platform?sslmode=disable
      HOST: 0.0.0.0
      PORT: 8084
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ops-service:
    image: test-ops-service:latest
    container_name: iot-ops-service
    ports:
      - "8085:8085"
    environment:
      DATABASE_URL: postgres://iot_admin:iot_admin_2024@postgres:5432/iot_platform?sslmode=disable
      HOST: 0.0.0.0
      PORT: 8085
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ota-service:
    image: ota-service:latest
    container_name: iot-ota-service
    ports:
      - "8088:8088"
    environment:
      DATABASE_URL: postgres://iot_admin:iot_admin_2024@postgres:5432/iot_platform?sslmode=disable
      HOST: 0.0.0.0
      PORT: 8086
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  voice-service:
    image: voice-service:latest
    container_name: iot-voice-service
    ports:
      - "8089:8089"
    environment:
      DATABASE_URL: postgres://iot_admin:iot_admin_2024@postgres:5432/iot_platform?sslmode=disable
      HOST: 0.0.0.0
      PORT: 8087
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  influxdb_data:
