[package]
name = "iot-data-service"
version = "0.1.0"
edition = "2021"

[dependencies]
iot-common = { path = "../common" }
actix-web = "4"
actix-cors = "0.7"
sea-orm = { version = "1", features = ["runtime-tokio-native-tls", "macros", "with-uuid", "with-chrono", "sqlx-postgres"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
