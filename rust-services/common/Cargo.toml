[package]
name = "iot-common"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1.0"
sea-orm = { version = "1", features = ["runtime-tokio-native-tls", "macros", "with-uuid", "with-chrono", "sqlx-postgres"] }
